name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Hermetic: no chain access. This is what gates a push.
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - name: Confirm dist/ structure
        run: |
          test -f dist/index.js
          test -f dist/networks.js
          test -f dist/tools/stocktokens.js
          test -f dist/tools/oracle.js
          test -f dist/tools/uniswap.js
          head -n1 dist/index.js | grep -q '^#!'

  # The server must start and advertise its tools without touching the chain.
  smoke:
    name: server starts and lists tools
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node test/ci-list-tools.mjs
